<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Module 9 – Table Assignment</title>
    <style>
        table {
            width: 60%;
            margin: 20px auto;
            border-collapse: collapse;
            text-align: center;
            font-family: Arial, sans-serif;
        }
        th, td {
            border: 2px solid #333;
            padding: 10px;
        }
        th {
            background-color: #4CAF50;
            color: white;
        }
        caption {
            caption-side: top;
            font-size: 24px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <table>
        <caption>Wedding invitaion 2026</caption>
        <tr>
            <th>Event Time</th>
            <th>Foods</th>
            <th>Events</th>
            <th>Grand Exsit</th>
        </tr>
        <tr>
            <td>10:20am</td>
            <td>Cheese and Cracker Board</td>
            <td>Welcome Party</td>
            <td> Happyly married 💒</td>
        </tr>
        <tr>
            
            <td>Grapes and Apple Slices</td>
            <td>Bridal Luncheon</td>
         
        </tr>
        <tr>
            
            <td>Lobster Mango Salad</td>
            <td>Couple's shower</td>
            
        </tr>
    </table>

</body>
</html>
