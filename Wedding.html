<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Module 9 – Table Assignment</title>
    <style>
        table {
            width: 60%;
            margin: 20px auto;
            border-collapse: collapse;
            text-align: center;
            font-family: Arial, sans-serif;
        }
        th, td {
            border: 2px solid #333;
            padding: 10px;
        }
        th {
            background-color: #4CAF50;
            color: white;
        }
        caption {
            caption-side: top;
            font-size: 24px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <table>
        <caption>Wedding invitation</caption>
        <tr>
            <th>Meet up time</th>
            <th>Foods</th>
            <th>Events</th>
            <th>Wedding</th>
        </tr>
        <tr>
            <td>3:48</td>
            <td>Cheese and Cracker Board</td>
            <td>Eggs and Toast</td>
            <td>Fried Chicken</td>
        </tr>
        <tr>
            <td>Graps and Apple Slices</td>
            <td>Chicken Noodie Soup</td>
            <td>Salmion</td>
        </tr>
        <tr>
          
            <td>Hot fried Chiken</td>
            <td>Turky</td>
            <td>Chicken and Rice</td>
        </tr>
    </table>

</body>
</html>
